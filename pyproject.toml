[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "project-intelligence-ingestion"
version = "0.1.0"
description = "Independent provider ingestion and Chroma indexing service"
requires-python = ">=3.12"
dependencies = [
  "azure-core==1.41.0",
  "azure-data-tables==12.7.0",
  "azure-identity==1.24.0",
  "beautifulsoup4==4.15.0",
  "chromadb==1.5.2",
  "fastapi==0.141.1",
  "huggingface-hub==1.27.0",
  "httpx==0.28.1",
  "langchain-text-splitters==1.1.2",
  "langgraph==1.2.11",
  "pillow==12.3.0",
  "prometheus-client==0.26.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.13.0",
  "pymongo==4.17.0",
  "pypdf==6.16.1",
  "sentence-transformers==5.7.0",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.16.0",
  "deptry==0.25.1",
  "import-linter==2.15",
  "mypy==1.20.2",
  "pre-commit==4.6.2",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.16.6",
]
worker = [
  "azure-servicebus==7.14.3",
  "docling==2.120.1",
  "docling-core==2.91.0",
  "transformers==5.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["app"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 70.08
precision = 2
show_missing = true
skip_covered = false
