repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: python -m ruff check app tests scripts tools
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check app tests scripts tools
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy application check
        entry: python -m mypy app
        language: system
        pass_filenames: false
        types: [python]
      - id: import-boundaries
        name: import boundaries
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: dependency-usage
        name: dependency usage
        entry: python -m deptry . --exclude '.venv|\.git|corpora|\.quality-runs' --optional-dependencies-dev-groups dev --per-rule-ignores DEP002=uvicorn,DEP004=pytest
        language: system
        pass_filenames: false
